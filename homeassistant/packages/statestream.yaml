# Under homeassistant/ because that prefix is already allowed for HA on both NATS tiers.
mqtt_statestream:
  base_topic: homeassistant/statestream
  publish_attributes: false
  publish_timestamps: false
  include:
    entity_globs:
      - sensor.boiler_*
      - binary_sensor.boiler_*
      - number.boiler_*
      - sensor.*_gas_usage_today
      - sensor.*_ht_temperature
    entities:
      - sensor.heating_active_setpoint
      - sensor.house_temperature
      - climate.boiler_heating
      - binary_sensor.recent_solar_gain
      - binary_sensor.heating_cutoff_active
      - input_number.heating_target_normal

# Statestream only publishes on change, so entities that rarely change would never reach ENERGY.
automation:
  - id: statestream_seed
    alias: Statestream seed slow entities
    mode: queued
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    actions:
      - repeat:
          for_each:
            - binary_sensor.recent_solar_gain
            - binary_sensor.heating_cutoff_active
            - input_number.heating_target_normal
          sequence:
            - condition: template
              value_template: "{{ states(repeat.item) not in ['unknown', 'unavailable'] }}"
            - action: mqtt.publish
              data:
                topic: "homeassistant/statestream/{{ repeat.item | replace('.', '/') }}/state"
                payload: "{{ states(repeat.item) }}"
                retain: true
