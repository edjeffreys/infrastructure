---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-agent-mcp
  namespace: claude-agent
data:
  # Managed policy: the complete set of MCP servers; the agent cannot add more.
  managed-mcp.json: |
    {
      "mcpServers": {
        "kubernetes": {
          "command": "kubernetes-mcp-server",
          "args": ["--config", "/etc/claude-code/kubernetes-mcp-server.toml"]
        },
        "github": {
          "command": "github-mcp-server",
          "args": ["stdio"],
          "env": {
            "GITHUB_PERSONAL_ACCESS_TOKEN": "${GH_TOKEN}"
          }
        }
      }
    }
  # 0.1.0 dropped every runtime CLI flag; an unknown key fails the load, so a
  # typo here stops the server rather than silently losing read_only.
  kubernetes-mcp-server.toml: |
    cluster_provider_strategy = "in-cluster"
    read_only = true
