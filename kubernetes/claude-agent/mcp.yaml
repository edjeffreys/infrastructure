---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-agent-mcp
  namespace: claude-agent
data:
  # Managed policy: the complete set of MCP servers; the agent cannot add more.
  managed-mcp.json: |
    {
      "mcpServers": {
        "kubernetes": {
          "command": "kubernetes-mcp-server",
          "args": [
            "--cluster-provider", "in-cluster",
            "--read-only"
          ]
        },
        "github": {
          "command": "github-mcp-server",
          "args": ["stdio"],
          "env": {
            "GITHUB_PERSONAL_ACCESS_TOKEN": "${GH_TOKEN}"
          }
        }
      }
    }
