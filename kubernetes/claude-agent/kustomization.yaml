apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - certificate.yaml
  - claude-agent-secret.yaml
  - consumer.yaml
  - deployment.yaml
  - mcp.yaml
  - memory.yaml
  - network-policy.yaml
  - pvc.yaml
  - rbac.yaml
  - settings.yaml

# Unhashed, so a change reaches the running pod's mount instead of rolling it.
configMapGenerator:
  - name: claude-agent-alert-dispatch
    namespace: claude-agent
    files:
      - config.env=alert-dispatch.env
      - alert-dispatch.sh
    options:
      disableNameSuffixHash: true
