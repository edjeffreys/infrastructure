---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-agent-settings
  namespace: claude-agent
data:
  # Managed policy, read-only: the agent can't edit it, unlike ~/.claude on the PVC.
  #
  # These allow/deny lists are convenience and defence in depth, NOT the
  # security boundary — that is the RBAC in rbac.yaml. The point of the allow
  # list is to stop routine read-only commands prompting on your phone.
  managed-settings.json: |
    {
      "theme": "dark",
      "allowManagedPermissionRulesOnly": true,
      "permissions": {
        "defaultMode": "default",
        "allow": [
          "Bash(kubectl get:*)",
          "Bash(kubectl describe:*)",
          "Bash(kubectl logs:*)",
          "Bash(kubectl top:*)",
          "Bash(kubectl explain:*)",
          "Bash(kubectl api-resources:*)",
          "Bash(kubectl auth can-i:*)",
          "Bash(kubectl events:*)",
          "Bash(kubectl diff:*)",
          "Bash(git status:*)",
          "Bash(git diff:*)",
          "Bash(git log:*)",
          "Bash(git show:*)",
          "Bash(git fetch:*)",
          "Bash(git branch:*)",
          "Bash(git clone https://github.com/edjeffreys/:*)",
          "Bash(git worktree:*)",
          "Bash(git symbolic-ref:*)",
          "Bash(gh repo list:*)",
          "Bash(gh repo view:*)",
          "Bash(gh pr list:*)",
          "Bash(gh pr view:*)",
          "Bash(gh run list:*)",
          "Bash(gh run view:*)",
          "Bash(helm template:*)",
          "Bash(rg:*)",
          "Bash(jq:*)",
          "mcp__kubernetes"
        ],
        "deny": [
          "Bash(kubectl get secret:*)",
          "Bash(kubectl get secrets:*)",
          "Bash(kubectl describe secret:*)",
          "Bash(kubectl describe secrets:*)",
          "Bash(kubectl get -o yaml secret:*)",
          "Bash(git push --force:*)",
          "Bash(git push -f:*)",
          "Bash(git push origin master:*)",
          "Bash(git push origin HEAD:master:*)",
          "Bash(git push origin main:*)",
          "Bash(git push origin HEAD:main:*)"
        ]
      }
    }
