---
# Holds ~/.claude (Remote Control registration, session history, settings) and
# the repo checkout. Losing it means re-pairing the session from scratch, so it
# is longhorn rather than an emptyDir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-agent-home
  namespace: claude-agent
  # Longhorn mirrors these onto the volume, so dropping default stops its trim.
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/default: enabled
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
