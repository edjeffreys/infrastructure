---
# Fields expected on the 1Password item:
#   CLAUDE_CODE_OAUTH_TOKEN  — from `claude setup-token` on a logged-in machine
#   GH_TOKEN                 — fine-grained PAT, contents:write + pull_requests:write
#                              on edjeffreys/infrastructure only
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: claude-agent
  namespace: claude-agent
spec:
  itemPath: "vaults/Secrets/items/Claude Agent"
