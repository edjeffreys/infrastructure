# Example: sync a 1Password item into a Kubernetes Secret.
# The operator creates a Secret in the same namespace with the same name.
#
# itemPath format: "vaults/<vault-name>/items/<item-name>"
# The resulting K8s Secret will have one key per field in the 1Password item.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: mealie-db-credentials
  namespace: mealie
spec:
  itemPath: "vaults/homelab/items/mealie-db"
