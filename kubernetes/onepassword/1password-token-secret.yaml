# NOTE: This secret bootstraps the 1Password operator itself.
# It must be applied manually once before the operator can run:
#   op inject -i 1password-token-secret.yaml | kubectl apply -f -
# After that, the operator manages all other secrets via OnePasswordItem resources.
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-service-account-token
  namespace: onepassword-operator
type: Opaque
stringData:
  token: "op://Secrets/1Password Service Account/token"
