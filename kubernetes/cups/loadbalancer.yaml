apiVersion: v1
kind: Service
metadata:
  name: cups-lb
  namespace: cups
  labels:
    app.kubernetes.io/name: cups-lb
  annotations:
    lbipam.cilium.io/ips: "10.0.0.212"
spec:
  type: LoadBalancer
  selector:
    app: cups
  ports:
    - name: ipp
      port: 631
      targetPort: ipp
      protocol: TCP

---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: cups
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: cups-lb
  interfaces:
    - ens18
  externalIPs: false
  loadBalancerIPs: true
