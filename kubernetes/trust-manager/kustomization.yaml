apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
  - network-policy.yaml

configMapGenerator:
  - name: trust-manager-values
    files:
      - values.yaml=trust-manager-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
