# Bootstrap: apply once with
#   op inject -i kubernetes/flux-system/flux-git-auth-secret.yaml | kubectl apply -f -
#
# Reuses the existing "Github ArgoCD Token" 1Password item — the same
# fine-grained PAT ArgoCD authenticates with. The item name is now a misnomer;
# it is left alone deliberately, because renaming it would break the live
# ArgoCD repo Secret while both controllers are running. Rename it after PR 14.
#
# Flux wants the key `password`; the 1Password field is `credential`.
#
# NOT in kustomization.yaml, and that is load-bearing: kubernetes/flux-system/
# is reconciled by Flux, so listing this file would have Flux apply it verbatim
# and overwrite the injected Secret with the literal string
# "op://Secrets/Github ArgoCD Token/credential" — killing its own Git auth on
# the next reconcile. See talos/talconfig.yaml for the same trap, sprung.
apiVersion: v1
kind: Secret
metadata:
  name: flux-git-auth
  namespace: flux-system
type: Opaque
stringData:
  username: "op://Secrets/Github ArgoCD Token/username"
  password: "op://Secrets/Github ArgoCD Token/credential"
