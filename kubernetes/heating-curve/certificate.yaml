apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: heating-curve
  namespace: heating-curve
spec:
  secretName: heating-curve-nats
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    kind: ClusterIssuer
    name: homelab-ca
  commonName: heating-curve.heating-curve
  usages:
    - client auth
