apiVersion: apps/v1
kind: Deployment
metadata:
  name: heating-curve
  namespace: heating-curve
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: heating-curve
  template:
    metadata:
      labels:
        app: heating-curve
    spec:
      nodeSelector:
        node-type: standard
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: heating-curve
          image: ghcr.io/edjeffreys/heating-curve:latest
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: homelab-ca, mountPath: /etc/nats-ca, readOnly: true}
            - {name: nats-client, mountPath: /etc/nats-client, readOnly: true}
      volumes:
        - name: homelab-ca
          configMap:
            name: homelab-ca
        - name: nats-client
          secret:
            secretName: heating-curve-nats
