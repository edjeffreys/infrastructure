---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emby-config
  namespace: emby
  # Longhorn mirrors these onto the volume, so dropping default stops its trim.
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/default: enabled
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emby-media
  namespace: emby
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Ti
  volumeName: emby-media-nfs
  storageClassName: ""
