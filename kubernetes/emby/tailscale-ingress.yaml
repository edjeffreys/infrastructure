apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emby-tailscale
  namespace: emby
  annotations:
    tailscale.com/hostname: "emby"
    tailscale.com/proxy-class: "standard"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emby
                port:
                  number: 8096
  tls:
    - hosts:
        - emby
