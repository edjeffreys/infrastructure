---
# Allow DNS
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: plex
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
# Allow plex internet egress (metadata, streaming)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plex-egress
  namespace: plex
spec:
  endpointSelector:
    matchLabels:
      app: plex
  egress:
    - toEntities:
        - world

---
# Allow ingress from traefik and seerr
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plex-ingress
  namespace: plex
spec:
  endpointSelector:
    matchLabels:
      app: plex
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arr
            k8s:app: seerr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arr
            k8s:app: radarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arr
            k8s:app: sonarr
      toPorts:
        - ports:
            - port: "32400"
