apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-media-nfs
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 10.60.0.233
    path: /mnt/main0/Media
    readOnly: true
  claimRef:
    namespace: plex
    name: plex-media
