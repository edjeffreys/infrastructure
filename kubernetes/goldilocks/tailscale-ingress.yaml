apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goldilocks-tailscale
  namespace: goldilocks
  annotations:
    tailscale.com/hostname: "goldilocks"
    tailscale.com/proxy-class: "standard"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goldilocks-dashboard
                port:
                  number: 80
  tls:
    - hosts:
        - goldilocks
