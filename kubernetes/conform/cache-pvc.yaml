---
# nfs, not longhorn, for the reason tdarr's cache is: a transcode writes a full
# working copy of every file, and longhorn would put it on the one disk twice.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conform-cache
  namespace: conform
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      storage: 500Gi
