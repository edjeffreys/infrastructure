---
# conform copies one of these into a Job without interpreting any of it, and
# picks between them per file: qsv only when the plan re-encodes the picture.
apiVersion: v1
kind: PodTemplate
metadata:
  name: conform-qsv
  namespace: conform
template:
  metadata:
    labels:
      app: conform-worker
  spec:
    restartPolicy: Never
    serviceAccountName: conform-worker
    nodeSelector:
      gpu: intel
    # csi-driver-nfs provisions a volume root owned by root, and the image runs
    # as 3000 with no way to chown it itself.
    initContainers:
      - name: chown-state
        image: ghcr.io/edjeffreys/conform:sha-40aaa33@sha256:436056d285ad89cd46add38361fde69b2c253034e013801fcb078e3efd479f89
        # -R because the excuse ledger is a directory under /state.
        command: ["chown", "-R", "3000:3000", "/state"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: state
            mountPath: /state
    containers:
      - name: conform
        image: ghcr.io/edjeffreys/conform:sha-40aaa33@sha256:436056d285ad89cd46add38361fde69b2c253034e013801fcb078e3efd479f89
        # No path: conform appends it, and refuses empty args.
        args:
          - apply
          - -config
          - /config/conform.yaml
          - -verbose
        resources:
          requests:
            memory: 1Gi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 2000m
            gpu.intel.com/i915: 1
        volumeMounts:
          - name: media
            mountPath: /data
          - name: state
            mountPath: /state
          - name: config
            mountPath: /config
    volumes:
      - name: media
        persistentVolumeClaim:
          claimName: conform-media
      - name: state
        persistentVolumeClaim:
          claimName: conform-state
      - name: config
        configMap:
          name: conform-config

---
# The same worker without a device, for work that never reaches the encoder.
apiVersion: v1
kind: PodTemplate
metadata:
  name: conform-cpu
  namespace: conform
template:
  metadata:
    labels:
      app: conform-worker
      conform-pool: cpu
  spec:
    restartPolicy: Never
    serviceAccountName: conform-worker
    nodeSelector:
      node-type: standard
    # One per node caps concurrency, and the scheduler refills a freed slot at
    # once rather than at the orchestrator's next pass. Scoped to this pool
    # because a rule over every worker would let a remux block worker-0, the
    # only node with the device.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                conform-pool: cpu
            topologyKey: kubernetes.io/hostname
    initContainers:
      - name: chown-state
        image: ghcr.io/edjeffreys/conform:sha-40aaa33@sha256:436056d285ad89cd46add38361fde69b2c253034e013801fcb078e3efd479f89
        command: ["chown", "-R", "3000:3000", "/state"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: state
            mountPath: /state
    containers:
      - name: conform
        image: ghcr.io/edjeffreys/conform:sha-40aaa33@sha256:436056d285ad89cd46add38361fde69b2c253034e013801fcb078e3efd479f89
        args:
          - apply
          - -config
          - /config/conform.yaml
          - -verbose
        resources:
          requests:
            memory: 1Gi
            cpu: 100m
          limits:
            memory: 1Gi
            cpu: 1000m
        volumeMounts:
          - name: media
            mountPath: /data
          - name: state
            mountPath: /state
          - name: config
            mountPath: /config
    volumes:
      - name: media
        persistentVolumeClaim:
          claimName: conform-media
      - name: state
        persistentVolumeClaim:
          claimName: conform-state
      - name: config
        configMap:
          name: conform-config
