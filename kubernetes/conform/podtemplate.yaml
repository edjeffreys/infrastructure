---
# conform copies one of these into a Job without interpreting any of it, and
# picks between them per file: qsv only when the plan re-encodes the picture.
apiVersion: v1
kind: PodTemplate
metadata:
  name: conform-qsv
  namespace: conform
template:
  metadata:
    labels:
      app: conform-worker
  spec:
    restartPolicy: Never
    serviceAccountName: conform-worker
    nodeSelector:
      gpu: intel
    # csi-driver-nfs provisions a volume root owned by root, and the image runs
    # as 3000 with no way to chown it itself.
    initContainers:
      - name: chown-state
        image: ghcr.io/edjeffreys/conform:sha-eb0871d@sha256:e14e4c6e5fa9d692e9a03044781ed6c331a902c6e0277aa8d4638eb955d524cb
        # -R because the excuse ledger is a directory under /state.
        command: ["chown", "-R", "3000:3000", "/state"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: state
            mountPath: /state
    containers:
      - name: conform
        image: ghcr.io/edjeffreys/conform:sha-eb0871d@sha256:e14e4c6e5fa9d692e9a03044781ed6c331a902c6e0277aa8d4638eb955d524cb
        # No path: conform appends it, and refuses empty args.
        args:
          - apply
          - -config
          - /config/conform.yaml
          - -verbose
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 4Gi
            # Held down because plex shares this node and its live transcodes
            # matter more than a background encode.
            cpu: 2000m
            gpu.intel.com/i915: 1
        volumeMounts:
          - name: media
            mountPath: /data
          - name: state
            mountPath: /state
          - name: config
            mountPath: /config
    volumes:
      - name: media
        persistentVolumeClaim:
          claimName: conform-media
      - name: state
        persistentVolumeClaim:
          claimName: conform-state
      - name: config
        configMap:
          name: conform-config

---
# The same worker without a device, for work that never reaches the encoder.
apiVersion: v1
kind: PodTemplate
metadata:
  name: conform-cpu
  namespace: conform
template:
  metadata:
    labels:
      app: conform-worker
  spec:
    restartPolicy: Never
    serviceAccountName: conform-worker
    nodeSelector:
      node-type: standard
    initContainers:
      - name: chown-state
        image: ghcr.io/edjeffreys/conform:sha-eb0871d@sha256:e14e4c6e5fa9d692e9a03044781ed6c331a902c6e0277aa8d4638eb955d524cb
        command: ["chown", "-R", "3000:3000", "/state"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: state
            mountPath: /state
    containers:
      - name: conform
        image: ghcr.io/edjeffreys/conform:sha-eb0871d@sha256:e14e4c6e5fa9d692e9a03044781ed6c331a902c6e0277aa8d4638eb955d524cb
        args:
          - apply
          - -config
          - /config/conform.yaml
          - -verbose
        resources:
          # Goldilocks measures a stream copy at 15m/100Mi; this is headroom
          # over that, not a guess.
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 2Gi
            # A stream copy is bounded by the export, not the CPU.
            cpu: 1000m
        volumeMounts:
          - name: media
            mountPath: /data
          - name: state
            mountPath: /state
          - name: config
            mountPath: /config
    volumes:
      - name: media
        persistentVolumeClaim:
          claimName: conform-media
      - name: state
        persistentVolumeClaim:
          claimName: conform-state
      - name: config
        configMap:
          name: conform-config
