---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conform-orchestrator
  namespace: conform
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    # The probe cache has one writer by design; a rolling update would briefly
    # give it two.
    type: Recreate
  selector:
    matchLabels:
      app: conform-orchestrator
  template:
    metadata:
      labels:
        app: conform-orchestrator
    spec:
      serviceAccountName: conform-orchestrator
      nodeSelector:
        node-type: standard
      # csi-driver-nfs provisions a volume root owned by root, and the image
      # runs as 3000 with no way to chown it itself.
      initContainers:
        - name: chown-state
          image: ghcr.io/edjeffreys/conform:sha-eb0871d@sha256:e14e4c6e5fa9d692e9a03044781ed6c331a902c6e0277aa8d4638eb955d524cb
          # Recursive: the excuse ledger is a directory under /state, and a
          # chown of the mount point alone leaves it unwritable.
          command: ["chown", "-R", "3000:3000", "/state"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: state
              mountPath: /state
      containers:
        - name: conform
          image: ghcr.io/edjeffreys/conform:sha-eb0871d@sha256:e14e4c6e5fa9d692e9a03044781ed6c331a902c6e0277aa8d4638eb955d524cb
          args:
            - orchestrate
            - -config
            - /config/conform.yaml
            - -verbose
            - -interval
            - 6h
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
          volumeMounts:
            - name: media
              mountPath: /data
              readOnly: true
            - name: state
              mountPath: /state
            - name: config
              mountPath: /config
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: conform-media
        - name: state
          persistentVolumeClaim:
            claimName: conform-state
        - name: config
          configMap:
            name: conform-config
