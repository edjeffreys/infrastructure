---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conform-orchestrator
  namespace: conform
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    # The probe cache has a single owner by design. Two orchestrators overlapping
    # during a rollout would both write it.
    type: Recreate
  selector:
    matchLabels:
      app: conform-orchestrator
  template:
    metadata:
      labels:
        app: conform-orchestrator
    spec:
      serviceAccountName: conform-orchestrator
      nodeSelector:
        node-type: standard
      containers:
        - name: conform
          image: ghcr.io/edjeffreys/conform:sha-cbf036a
          args:
            - orchestrate
            - -config
            - /config/conform.yaml
            # Creates no Jobs. It still reads the cluster and renders each Job
            # in full, which is the whole of what this first deployment is for:
            # nothing rewrites a library file until this comes off.
            - -dry-run
            - -verbose
            - -interval
            - 6h
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              # ffprobe over an unscanned library is the expensive part, and it
              # is one file at a time.
              cpu: 1000m
          volumeMounts:
            - name: media
              mountPath: /data
              # The orchestrator only ever plans. Replacing a file is the
              # worker's job, on a node with the device to do it.
              readOnly: true
            - name: state
              mountPath: /state
            - name: config
              mountPath: /config
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: conform-media
        - name: state
          persistentVolumeClaim:
            claimName: conform-state
        - name: config
          configMap:
            name: conform-config
