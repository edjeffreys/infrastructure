# Explicit resources list, not autodetect: conform-values.yaml is conform's own
# config, with no apiVersion/kind, and autodetect would fail the whole build on
# it with "missing Resource metadata". The `-values.yaml` suffix is what keeps
# it out of kubeconform too — it is not a Helm chart, but the exclusion the
# suffix buys is the same one it needs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: conform
resources:
  - namespace.yaml
  - rbac.yaml
  - media-pv.yaml
  - cache-pvc.yaml
  - state-pvc.yaml
  - podtemplate.yaml
  - deployment.yaml
  - network-policy.yaml

configMapGenerator:
  # No name suffix hash: the PodTemplate names this ConfigMap, and kustomize
  # does not rewrite references inside a PodTemplate the way it does inside a
  # Deployment — a hashed name would leave every Job mounting a ConfigMap that
  # does not exist. The reloader annotation on the Deployment is what picks up
  # an edit instead.
  - name: conform-config
    files:
      - conform.yaml=conform-values.yaml
    options:
      disableNameSuffixHash: true
