libraries:
  - name: movies
    path: /data/Movies
    profile: standard
  - name: tv
    path: /data/TV Shows
    profile: standard

profiles:
  standard:
    container: mkv

    video:
      codecs: [hevc]
      # No maxHeight: 4K is kept, and a downscale is the one change here that
      # loses quality irreversibly.
      #
      # vaapi rather than qsv: chosen when the image shipped oneVPL's dispatcher
      # and no runtime (#72). It ships libmfx-gen1.2 now, so qsv is worth
      # retesting — by initialising the encoder, not by reading vainfo.
      #
      # scale_vaapi, not scale: the frames are in GPU memory, and the software
      # filter would download and re-upload around every scale.
      #
      # w={width} resolves to -2, not -1: an odd width would be rejected.
      scaleFilter: "scale_vaapi=w={width}:h={height}"
      encoder:
        name: hevc_vaapi
        # A named device rather than a path, because hwupload below needs one and
        # -filter_hw_device is the only way to hand it to the filter graph.
        inputArgs:
          - -init_hw_device
          - "vaapi=conform:/dev/dri/renderD128"
          - -filter_hw_device
          - conform
          - -hwaccel
          - vaapi
          - -hwaccel_output_format
          - vaapi
          - -hwaccel_device
          - conform
        # Offering p010le is what keeps a 10-bit source 10-bit: with nv12 alone
        # the upload negotiates the depth down, and codec, duration and size all
        # still come out right. hwupload uploads what the GPU could not decode.
        filter: "format=nv12|p010le|vaapi,hwupload"
        options:
          # No preset: vaapi has no such option and rejects it. compression_level
          # is the equivalent, 1 being the slowest and best the driver offers.
          compression_level: "1"
          global_quality: "18"

    audio:
      languages: [eng, und]
      codecs: [aac, ac3, eac3, opus, truehd, dts]
      maxChannels: 8
      order: [language, channels]
      encoder:
        name: eac3
        options:
          b: "640k"

    subtitles:
      languages: [eng, und]
      codecs: [subrip, ass, hdmv_pgs_subtitle]
      order: [language]

    job:
      podTemplate: conform-cpu
      videoTemplate: conform-qsv
      container: conform

execution:
  # Deliberately on the media export: same filesystem as the source, so conform
  # stages by rename rather than copying the encode a second time.
  tempDir: /data/.conform-temp
  # Not /config: that holds this file, and a ConfigMap mount is read-only.
  stateDir: /state
  workers: 1
  # Matches arr, plex and tdarr on the shared export.
  owner:
    uid: 3000
    gid: 3000

webhook:
  # No rewrite: sonarr and radarr mount the same export at /data.
  listen: ":8080"

orchestrator:
  namespace: conform
  # Queue depth again, not concurrency: the anti-affinity in podtemplate.yaml
  # is what limits how many run, and it does so without waiting for a pass.
  maxActive: 250
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
