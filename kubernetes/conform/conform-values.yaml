libraries:
  - name: movies
    path: /data/Movies
    profile: standard
  - name: tv
    path: /data/TV Shows
    profile: standard

profiles:
  standard:
    container: mkv

    video:
      codecs: [hevc]
      # No maxHeight: 4K is kept, and a downscale is the one change here that
      # loses quality irreversibly.
      #
      # vaapi rather than qsv: same silicon, but the image ships oneVPL's
      # dispatcher with no runtime behind it, so hevc_qsv fails to start.
      #
      # scale_vaapi, not scale: the frames are in GPU memory, and the software
      # filter would download and re-upload around every scale.
      scaleFilter: "scale_vaapi=h={height}:w=-1"
      encoder:
        name: hevc_vaapi
        inputArgs:
          - -hwaccel
          - vaapi
          - -hwaccel_output_format
          - vaapi
          - -hwaccel_device
          - /dev/dri/renderD128
        options:
          # No preset: vaapi has no such option and rejects it.
          global_quality: "20"

    audio:
      languages: [eng, und]
      codecs: [aac, ac3, eac3, opus, truehd, dts]
      maxChannels: 8
      order: [language, channels]
      encoder:
        name: eac3
        options:
          b: "640k"

    subtitles:
      languages: [eng, und]
      codecs: [subrip, ass, hdmv_pgs_subtitle]
      order: [language]

    job:
      podTemplate: conform-cpu
      videoTemplate: conform-qsv
      container: conform

execution:
  # Deliberately on the media export: same filesystem as the source, so conform
  # stages by rename rather than copying the encode a second time.
  tempDir: /data/.conform-temp
  # Not /config: that holds this file, and a ConfigMap mount is read-only.
  stateDir: /state
  workers: 1
  # Matches arr, plex and tdarr on the shared export.
  owner:
    uid: 3000
    gid: 3000

webhook:
  # No rewrite: sonarr and radarr mount the same export at /data.
  listen: ":8080"

orchestrator:
  namespace: conform
  # Queue depth again, not concurrency: the anti-affinity in podtemplate.yaml
  # is what limits how many run, and it does so without waiting for a pass.
  maxActive: 250
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
