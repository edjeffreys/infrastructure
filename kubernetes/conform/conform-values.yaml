libraries:
  - name: movies
    path: /data/Movies
    profile: standard
  - name: tv
    path: /data/TV Shows
    profile: standard

profiles:
  standard:
    container: mkv

    video:
      codecs: [hevc]
      # No maxHeight: 4K is kept, and a downscale is the one change here that
      # loses quality irreversibly.
      #
      # scale_qsv, not scale: with -hwaccel qsv the frames are in GPU memory and
      # the software filter would download and re-upload around every scale.
      scaleFilter: "scale_qsv=h={height}:w=-1"
      encoder:
        name: hevc_qsv
        inputArgs: ["-hwaccel", "qsv", "-hwaccel_output_format", "qsv"]
        options:
          global_quality: "20"
          preset: "slow"

    audio:
      languages: [eng, und]
      codecs: [aac, ac3, eac3, opus]
      maxChannels: 6
      order: [language, channels]
      encoder:
        name: eac3
        options:
          b: "640k"

    subtitles:
      languages: [eng, und]
      codecs: [subrip, ass, hdmv_pgs_subtitle]
      order: [language]

    job:
      podTemplate: conform-qsv
      container: conform

execution:
  tempDir: /temp
  # Not /config: that holds this file, and a ConfigMap mount is read-only.
  stateDir: /state
  workers: 1
  # Matches arr, plex and tdarr on the shared export.
  owner:
    uid: 3000
    gid: 3000

orchestrator:
  namespace: conform
  # One free i915 device. A higher cap only parks Jobs Pending on it while they
  # still count against the cap, which is what stalls the next pass.
  maxActive: 1
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
