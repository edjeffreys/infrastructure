---
# Postgres for the arr stack (sonarr, radarr, seerr), replacing their per-app
# SQLite files on ReadWriteOnce Longhorn volumes.
#
# The Cluster lives in the arr namespace rather than a central database
# namespace for two reasons. First, CloudNativePG generates the credentials
# Secret (arr-postgres-app, type kubernetes.io/basic-auth) in the Cluster's own
# namespace, so the Deployments can consume it directly via secretKeyRef — a
# shared cluster would need spec.managed.roles, whose passwordSecret must be
# basic-auth, which the OnePasswordItem CRD cannot produce. Second, it keeps all
# database traffic inside one namespace under the cluster-wide default-deny.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: arr-postgres
  namespace: arr
spec:
  # Two instances, one per PIA node.
  #
  # This is not really about availability, it is about node drains. CNPG gives
  # every Cluster a PodDisruptionBudget, and for a *single-instance* cluster
  # that PDB deliberately blocks draining the node the instance sits on —
  # there is nowhere to switch over to. A Talos upgrade draining that PIA node
  # would then hang indefinitely rather than fail loudly. With two instances the
  # drain triggers a switchover and completes normally.
  #
  # The cost is a second copy on the shared Proxmox disk, but the whole dataset
  # is ~20MB and the arr write rate is low, so the write amplification that
  # drives most sizing decisions in this cluster does not really apply here.
  instances: 2

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie

  # Pinned to the PIA pool alongside its only clients. NoExecute only — per
  # CLAUDE.md, NoSchedule is redundant on these nodes and must not be added.
  affinity:
    nodeSelector:
      node-type: pia
    # required, not the default preferred: co-locating both instances on one
    # PIA node would put us straight back to a drain of that node having
    # nowhere to switch over to, which is the entire reason for instances: 2.
    # With exactly two PIA nodes this pins one instance to each.
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    tolerations:
      - key: node-type
        operator: Equal
        value: pia
        effect: NoExecute

  storage:
    # longhorn-single, not longhorn: CNPG already keeps a second full copy of
    # this database via streaming replication (instances: 2 above), so the
    # default class's numberOfReplicas: 2 would make four copies on the one
    # Proxmox physical disk and four writes per commit. The CNPG docs call this
    # out directly and recommend one block-storage replica. The class also sets
    # dataLocality: best-effort, so each instance reads its own disk rather than
    # crossing the network.
    size: 8Gi
    storageClass: longhorn-single

  postgresql:
    parameters:
      # The combined working set is ~20MB. These are sized for a handful of
      # connections from three single-replica apps, not for throughput.
      max_connections: "100"
      shared_buffers: 128MB
      work_mem: 8MB
      maintenance_work_mem: 64MB

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  monitoring:
    enablePodMonitor: true

  # Creates role "arr" and a placeholder database. The databases the apps
  # actually use are declared in databases.yaml, all owned by this role — see
  # the comment there.
  bootstrap:
    initdb:
      database: app
      owner: arr
