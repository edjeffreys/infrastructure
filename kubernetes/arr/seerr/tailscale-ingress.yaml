apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr-tailscale
  namespace: arr
  annotations:
    tailscale.com/hostname: "seerr"
    tailscale.com/proxy-class: "standard"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seerr
                port:
                  number: 5055
  tls:
    - hosts:
        - seerr
