apiVersion: v1
kind: Service
metadata:
  name: dns-sd-lb
  namespace: dns-sd
  labels:
    app.kubernetes.io/name: dns-sd-lb
  annotations:
    lbipam.cilium.io/ips: "10.0.0.213"
spec:
  type: LoadBalancer
  selector:
    app: dns-sd
  ports:
    - name: dns
      port: 53
      targetPort: dns
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP

---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: dns-sd
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: dns-sd-lb
  interfaces:
    - ens18
  externalIPs: false
  loadBalancerIPs: true
