---
# Duplicated into arc-runners as well — the AutoscalingRunnerSet resolves
# `githubConfigSecret` in its own namespace, not the controller's. See
# kubernetes/arc-runners/github-app-secret.yaml and kubernetes/arc-systems/README.md
# for the field names the 1Password item must carry.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: arc-github-app
  namespace: arc-systems
spec:
  itemPath: "vaults/Secrets/items/Github ARC"
