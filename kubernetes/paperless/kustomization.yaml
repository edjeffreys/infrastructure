# Explicit resources list, not autodetect: kustomize-controller treats every
# YAML under spec.path as a manifest, and paperless-values.yaml is Helm values
# with no apiVersion/kind. Leaving it to autodetect fails the whole build with
# "missing Resource metadata". This is the Flux equivalent of ArgoCD's
# `directory.exclude: "*-values.yaml"`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless
resources:
  - namespace.yaml
  - network-policy.yaml
  - paperless-secret.yaml
  - redis.yaml
  - tailscale-ingress.yaml

configMapGenerator:
  # Replaces ArgoCD's `$values/` git ref, which has no Flux equivalent. The
  # values file itself stays exactly where it was — Renovate's runner-image
  # regexManager and kubeconform's ignore pattern both key off the
  # `-values.yaml` suffix.
  - name: paperless-values
    files:
      # helm-controller reads the `values.yaml` key by default.
      - values.yaml=paperless-values.yaml
    options:
      # Required: a hashed name would not match the HelmRelease's valuesFrom.
      # helm-controller checksums the ConfigMap's *content*, so a stable name
      # still triggers an upgrade when the values change.
      disableNameSuffixHash: true
      labels:
        # Without this a values change waits for the HelmRelease interval
        # instead of upgrading on the next reconcile.
        reconcile.fluxcd.io/watch: Enabled
