apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-tailscale
  namespace: paperless
  annotations:
    tailscale.com/hostname: "paperless"
    tailscale.com/proxy-class: "standard"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless-paperless-ngx
                port:
                  number: 8000
  tls:
    - hosts:
        - paperless
