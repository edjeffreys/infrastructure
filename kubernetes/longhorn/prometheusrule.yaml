apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn
  namespace: longhorn-system
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: longhorn
      rules:
        - alert: LonghornVolumeActualSpaceUsedWarning
          annotations:
            summary: Longhorn volume {{ $labels.volume }} on {{ $labels.node }} is using {{ $value | humanizePercentage }} of its capacity.
          expr: (longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) > 0.90
          for: 5m
          labels:
            severity: warning

        - alert: LonghornVolumeDegraded
          annotations:
            summary: Longhorn volume {{ $labels.volume }} is degraded — expected {{ $labels.expected_replicas }} replicas, got {{ $labels.actual_replicas }}.
          expr: longhorn_volume_robustness == 2
          for: 5m
          labels:
            severity: warning

        - alert: LonghornVolumeFaulted
          annotations:
            summary: Longhorn volume {{ $labels.volume }} is faulted.
          expr: longhorn_volume_robustness == 3
          for: 2m
          labels:
            severity: critical

        - alert: LonghornNodeStorageWarning
          annotations:
            summary: Longhorn node {{ $labels.node }} has less than 20% storage available.
          expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) > 0.80
          for: 5m
          labels:
            severity: warning

        - alert: LonghornNodeStorageCritical
          annotations:
            summary: Longhorn node {{ $labels.node }} has less than 10% storage available.
          expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) > 0.90
          for: 5m
          labels:
            severity: critical

        - alert: LonghornNodeDown
          annotations:
            summary: Longhorn node {{ $labels.node }} is down.
          expr: longhorn_node_status{condition="ready"} == 0
          for: 5m
          labels:
            severity: critical

        - alert: LonghornDiskPressure
          annotations:
            summary: Longhorn disk on {{ $labels.node }} is not schedulable.
          expr: longhorn_disk_status{condition="schedulable"} == 0
          for: 5m
          labels:
            severity: warning
