service:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  spec:
    loadBalancerIP: "10.0.0.210"
    # Preserves the client source IP. Under `Cluster` every request reaches
    # backends SNAT'd to the traefik pod IP, so Plex saw 10.52.x and treated
    # LAN clients as WAN, capping their stream bitrate.
    externalTrafficPolicy: Local

# One replica per control plane node. `externalTrafficPolicy: Local` drops
# traffic on any node without a local endpoint, and the Cilium L2 lease can sit
# on any of the three, so all three need a pod.
deployment:
  replicas: 3

# Keeps the three replicas one-per-node rather than stacked.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
        topologyKey: kubernetes.io/hostname

# Run on CP node — firewall rules permit outbound to internal services (e.g. TrueNAS)
# from CP node IPs only.
nodeSelector:
  node-role.kubernetes.io/control-plane: ""
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

providers:
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
  kubernetesCRD:
    enabled: true
    allowExternalNameServices: true

# Renamed from `logs.general.level` in traefik chart v41 — the chart schema
# sets additionalProperties: false, so the old key is a hard sync failure
# rather than being silently ignored.
log:
  level: INFO

ports:
  web:
    port: 80
    exposedPort: 80
  websecure:
    port: 443
    exposedPort: 443
