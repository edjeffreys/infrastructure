# A long-lived ServiceAccount token. Declared with no `data`: the token
# controller populates it after creation, and it must stay that way.
#
# `ssa: merge` is the guard. Under ArgoCD this Secret needed an
# `ignoreDifferences` block on `.data`, because its client-side diff saw the
# controller-populated value as drift and selfHeal wiped the token on every
# sync — killing the credential silently. Flux is better behaved by default,
# since server-side apply only removes fields the applying manager previously
# owned and this manifest never claims `data`. The annotation makes that
# explicit rather than relying on it, which is worth doing for a credential
# whose failure mode is silent.
#
# Pruning is deliberately left on: removing this file revokes the token
# immediately. See clusterrolebinding.yaml for the softer revocation.
apiVersion: v1
kind: Secret
metadata:
  name: remote-admin-token
  namespace: cluster-access
  annotations:
    kubernetes.io/service-account.name: remote-admin
    kustomize.toolkit.fluxcd.io/ssa: merge
type: kubernetes.io/service-account-token
