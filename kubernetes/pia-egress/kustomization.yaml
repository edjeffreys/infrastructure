apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pia-egress
resources:
  - network-policy.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: pia-egress-values
    files:
      - values.yaml=pia-egress-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
