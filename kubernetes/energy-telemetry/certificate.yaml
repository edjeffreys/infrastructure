apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: energy-telemetry
  namespace: energy-telemetry
spec:
  secretName: energy-telemetry-nats
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    kind: ClusterIssuer
    name: homelab-ca
  commonName: energy-telemetry.energy-telemetry
  usages:
    - client auth
