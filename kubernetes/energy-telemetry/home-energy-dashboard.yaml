apiVersion: v1
kind: ConfigMap
metadata:
  name: home-energy-dashboard
  namespace: energy-telemetry
  labels:
    grafana_dashboard: "1"
data:
  home-energy.json: |-
    {
      "title": "Home energy",
      "uid": "home-energy",
      "schemaVersion": 39,
      "editable": false,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "tags": [
        "energy",
        "nats"
      ],
      "panels": [
        {
          "id": 1,
          "title": "Electricity now",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "glow_electricity_power_kw * 1000",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none"
          }
        },
        {
          "id": 2,
          "title": "Electricity in range",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "increase(glow_electricity_import_kwh[$__range])",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "title": "Gas in range",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "increase(glow_gas_import_kwh[$__range])",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none"
          }
        },
        {
          "id": 4,
          "title": "Unit cost in range (excl. standing charge)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "increase(glow_electricity_import_kwh[$__range]) * glow_electricity_unit_rate_gbp_per_kwh + increase(glow_gas_import_kwh[$__range]) * glow_gas_unit_rate_gbp_per_kwh",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyGBP"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none"
          }
        },
        {
          "id": 5,
          "title": "Outside",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "ha_entity_state{entity=\"boiler_outside_temperature\"}",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none"
          }
        },
        {
          "id": 6,
          "title": "Electricity demand",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "glow_electricity_power_kw * 1000",
              "legendFormat": "power"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "sum(host_power_cpu_watts) + sum(host_power_gpu_watts)",
              "legendFormat": "homelab CPU + GPU"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 7,
          "title": "Gas per hour",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "increase(glow_gas_import_kwh[1h])",
              "legendFormat": "kWh/h"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 8,
          "title": "Electricity per hour",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "increase(glow_electricity_import_kwh[1h])",
              "legendFormat": "kWh/h"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 9,
          "title": "Boiler temperatures",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "ha_entity_state{entity=\"boiler_supply_temperature\"}",
              "legendFormat": "supply"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "ha_entity_state{entity=\"boiler_outside_temperature\"}",
              "legendFormat": "outside"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "C",
              "expr": "ha_entity_state{entity=\"boiler_dhw_storage_temperature\"}",
              "legendFormat": "DHW storage"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 10,
          "title": "Burner modulation",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "ha_entity_state{entity=\"boiler_burner_modulation\"}",
              "legendFormat": "modulation"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 11,
          "title": "Burner and pump",
          "type": "state-timeline",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 12,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "ha_entity_state{entity=\"boiler_burner\"}",
              "legendFormat": "burner"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "ha_entity_state{entity=\"boiler_circulation_pump\"}",
              "legendFormat": "pump"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "off",
                      "color": "transparent"
                    },
                    "1": {
                      "text": "on",
                      "color": "orange"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 12,
          "title": "Burner starts per hour",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 28,
            "w": 12,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "increase(ha_entity_state{entity=\"boiler_burner_starts\"}[1h])",
              "legendFormat": "starts/h"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 13,
          "title": "System pressure",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 33,
            "w": 12,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "ha_entity_state{entity=\"boiler_supply_pressure\"}",
              "legendFormat": "pressure"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "pressurebar",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 14,
          "title": "Homelab power (CPU and GPU only)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 33,
            "w": 12,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "host_power_cpu_watts",
              "legendFormat": "{{host}} CPU"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "host_power_gpu_watts",
              "legendFormat": "{{host}} GPU"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {}
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
