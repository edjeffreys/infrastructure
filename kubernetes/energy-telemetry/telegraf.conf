[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true
  skip_processors_after_aggregators = true

[[inputs.nats_consumer]]
  servers = ["tls://nats.nats.svc:4222"]
  subjects = ["glow.*.SENSOR.electricitymeter"]
  tls_ca = "/etc/nats-ca/ca.crt"
  tls_cert = "/etc/nats-client/tls.crt"
  tls_key = "/etc/nats-client/tls.key"
  data_format = "json_v2"
  [[inputs.nats_consumer.json_v2]]
    measurement_name = "glow_electricity"
    [[inputs.nats_consumer.json_v2.field]]
      path = "electricitymeter.power.value"
      rename = "power_kw"
      type = "float"
    [[inputs.nats_consumer.json_v2.field]]
      path = "electricitymeter.energy.import.cumulative"
      rename = "import_kwh"
      type = "float"
    [[inputs.nats_consumer.json_v2.field]]
      path = "electricitymeter.energy.export.cumulative"
      rename = "export_kwh"
      type = "float"
    [[inputs.nats_consumer.json_v2.field]]
      path = "electricitymeter.energy.import.price.unitrate"
      rename = "unit_rate_gbp_per_kwh"
      type = "float"
    [[inputs.nats_consumer.json_v2.field]]
      path = "electricitymeter.energy.import.price.standingcharge"
      rename = "standing_charge_gbp_per_day"
      type = "float"

[[inputs.nats_consumer]]
  servers = ["tls://nats.nats.svc:4222"]
  subjects = ["glow.*.SENSOR.gasmeter"]
  tls_ca = "/etc/nats-ca/ca.crt"
  tls_cert = "/etc/nats-client/tls.crt"
  tls_key = "/etc/nats-client/tls.key"
  data_format = "json_v2"
  [[inputs.nats_consumer.json_v2]]
    measurement_name = "glow_gas"
    [[inputs.nats_consumer.json_v2.field]]
      path = "gasmeter.energy.import.cumulative"
      rename = "import_kwh"
      type = "float"
    [[inputs.nats_consumer.json_v2.field]]
      path = "gasmeter.energy.import.cumulativevol"
      rename = "import_m3"
      type = "float"
    [[inputs.nats_consumer.json_v2.field]]
      path = "gasmeter.energy.import.price.unitrate"
      rename = "unit_rate_gbp_per_kwh"
      type = "float"
    [[inputs.nats_consumer.json_v2.field]]
      path = "gasmeter.energy.import.price.standingcharge"
      rename = "standing_charge_gbp_per_day"
      type = "float"

[[inputs.nats_consumer]]
  servers = ["tls://nats.nats.svc:4222"]
  subjects = ["homeassistant.statestream.>"]
  tls_ca = "/etc/nats-ca/ca.crt"
  tls_cert = "/etc/nats-client/tls.crt"
  tls_key = "/etc/nats-client/tls.key"
  name_override = "ha_entity"
  data_format = "value"
  data_type = "string"

[[inputs.nats_consumer]]
  servers = ["tls://nats.nats.svc:4222"]
  subjects = ["truenas.power", "proxmox.power"]
  tls_ca = "/etc/nats-ca/ca.crt"
  tls_cert = "/etc/nats-client/tls.crt"
  tls_key = "/etc/nats-client/tls.key"
  data_format = "json_v2"
  [[inputs.nats_consumer.json_v2]]
    measurement_name = "host_power"
    [[inputs.nats_consumer.json_v2.field]]
      path = "cpu_power"
      rename = "cpu_watts"
      type = "float"
    [[inputs.nats_consumer.json_v2.field]]
      path = "gpu_power"
      rename = "gpu_watts"
      type = "float"
      optional = true
    [[inputs.nats_consumer.json_v2.field]]
      path = "gpu_pstate"
      type = "string"
      optional = true

[[processors.regex]]
  order = 1
  namepass = ["host_power"]
  [[processors.regex.tags]]
    key = "subject"
    pattern = '^([^.]+)\.power$'
    replacement = "${1}"
    result_key = "host"
  [[processors.regex.fields]]
    key = "gpu_pstate"
    pattern = '^P(\d+)$'
    replacement = "${1}"

[[processors.converter]]
  order = 2
  namepass = ["host_power"]
  [processors.converter.fields]
    integer = ["gpu_pstate"]

[[processors.regex]]
  order = 1
  namepass = ["ha_entity"]
  [[processors.regex.tags]]
    key = "subject"
    pattern = '^homeassistant\.statestream\.([^.]+)\.([^.]+)\.state$'
    replacement = "${1}"
    result_key = "domain"
  [[processors.regex.tags]]
    key = "subject"
    pattern = '^homeassistant\.statestream\.([^.]+)\.([^.]+)\.state$'
    replacement = "${2}"
    result_key = "entity"

[[processors.enum]]
  order = 2
  namepass = ["ha_entity"]
  [[processors.enum.mapping]]
    fields = ["value"]
    [processors.enum.mapping.value_mappings]
      on = 1
      off = 0

# Text states ("eco", "unavailable") fail conversion and are dropped.
[[processors.converter]]
  order = 3
  namepass = ["ha_entity"]
  [processors.converter.fields]
    float = ["value"]

[[processors.rename]]
  order = 4
  namepass = ["ha_entity"]
  [[processors.rename.replace]]
    field = "value"
    dest = "state"

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  # ViCare entities publish only on change; the default 60s expiry would drop the steady ones.
  expiration_interval = "0s"
  collectors_exclude = ["gocollector", "process"]
  tagexclude = ["subject"]
