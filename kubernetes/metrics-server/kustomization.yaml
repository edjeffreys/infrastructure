# No manifests to apply here beyond the generated values ConfigMap — metrics-
# server runs in kube-system (excluded from the default-deny clusterwide
# policy) so it needs no namespace.yaml or CiliumNetworkPolicy of its own.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system

configMapGenerator:
  # Replaces ArgoCD's `$values/` git ref, which has no Flux equivalent. The
  # values file itself stays exactly where it was — Renovate's regexManager and
  # kubeconform's ignore pattern both key off the `-values.yaml` suffix.
  - name: metrics-server-values
    files:
      - values.yaml=metrics-server-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
