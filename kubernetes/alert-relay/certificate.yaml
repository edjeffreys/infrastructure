apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alert-relay
  namespace: alert-relay
spec:
  secretName: alert-relay-nats
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    kind: ClusterIssuer
    name: homelab-ca
  commonName: alert-relay.alert-relay
  usages:
    - client auth
