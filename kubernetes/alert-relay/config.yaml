apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-relay
  namespace: alert-relay
data:
  connect.yaml: |
    http:
      address: 0.0.0.0:4195

    # Responds only once every alert is acked by JetStream, so a failure makes Alertmanager retry.
    input:
      http_server:
        path: /alertmanager
        allowed_verbs: [POST]
        timeout: 10s

    pipeline:
      processors:
        - mapping: root = this.alerts
        - unarchive:
            format: json_array

    output:
      nats_jetstream:
        urls: [tls://nats.nats.svc:4222]
        subject: >-
          alerts.${! this.status }.${! this.labels.severity.or("none").re_replace_all("[^A-Za-z0-9_-]", "_") }.${! this.labels.alertname.or("unknown").re_replace_all("[^A-Za-z0-9_-]", "_") }
        headers:
          Nats-Msg-Id: ${! this.fingerprint }-${! this.status }-${! this.startsAt }
        tls:
          enabled: true
          root_cas_file: /etc/nats-ca/ca.crt
          client_certs:
            - cert_file: /etc/nats-client/tls.crt
              key_file: /etc/nats-client/tls.key

    logger:
      level: INFO
      format: json
