apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: standard
spec:
  statefulSet:
    pod:
      nodeSelector:
        node-type: standard
      tailscaleContainer:
        env:
          # Same trap as the node-level tailscaled in talos/talconfig.yaml:
          # without --port it binds an ephemeral port that no policy can match,
          # so the proxy has no advertisable endpoint and every peer relays.
          - name: TS_TAILSCALED_EXTRA_ARGS
            value: --port=41641
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: pia-exit
spec:
  statefulSet:
    pod:
      nodeSelector:
        node-type: pia
      tolerations:
        - key: node-type
          operator: Equal
          value: pia
          effect: NoSchedule
        - key: node-type
          operator: Equal
          value: pia
          effect: NoExecute
      tailscaleContainer:
        env:
          # Same trap as the node-level tailscaled in talos/talconfig.yaml:
          # without --port it binds an ephemeral port that no policy can match,
          # so the proxy has no advertisable endpoint and every peer relays.
          - name: TS_TAILSCALED_EXTRA_ARGS
            value: --port=41641
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
