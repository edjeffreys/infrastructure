apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: nats-mqtt
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cluster-routes
  namespace: nats-mqtt
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: nats
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: nats
      toPorts:
        - ports:
            - port: "6222"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: nats
      toPorts:
        - ports:
            - port: "6222"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-leafnode-egress
  namespace: nats-mqtt
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: nats
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: nats
            app.kubernetes.io/component: nats
      toPorts:
        - ports:
            - port: "7422"
              protocol: TCP

---
# Cilium SNATs VIP traffic at the announcing control-plane node, so devices
# arrive as remote-node, not 10.100.0.x. Filter by source at the router.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-mqtt-ingress
  namespace: nats-mqtt
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: nats
  ingress:
    - fromEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
            - port: "8883"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-client-ingress
  namespace: nats-mqtt
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: nats
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: nats-box
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
