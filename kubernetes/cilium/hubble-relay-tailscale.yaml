apiVersion: v1
kind: Service
metadata:
  name: hubble-relay-tailscale
  namespace: kube-system
  annotations:
    tailscale.com/hostname: hubble-relay
    tailscale.com/proxy-class: standard
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    k8s-app: hubble-relay
  ports:
    - port: 80
      targetPort: grpc
      protocol: TCP
