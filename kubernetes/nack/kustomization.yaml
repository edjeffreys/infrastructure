apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nack
resources:
  - certificate.yaml
  - network-policy.yaml

configMapGenerator:
  - name: nack-values
    files:
      - values.yaml=nack-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
