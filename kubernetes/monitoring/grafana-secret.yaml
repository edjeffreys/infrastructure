# Grafana admin credentials from 1Password.
# Requires a Login item named "Grafana Admin" in the Secrets vault with fields:
#   username — the admin username (e.g. admin)
#   password — the admin password
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  itemPath: "vaults/Secrets/items/Grafana Admin"
