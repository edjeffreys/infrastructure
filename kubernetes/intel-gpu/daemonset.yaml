---
# Intel GPU device plugin.
#
# Deployed as the plain upstream DaemonSet rather than via the
# intel-device-plugins-operator Helm chart: the operator route pulls in CRDs
# plus a cert-manager-backed admission webhook to manage a single DaemonSet on
# a single node. Not worth the moving parts here.
#
# It advertises gpu.intel.com/i915 on nodes with a DRM render node and injects
# /dev/dri/renderD128 (with the right group) into any container that requests
# the resource — so plex needs no privileged securityContext and no hostPath,
# and the plex namespace stays under default PSA.
#
# Renovate tracks the image via the standard docker datasource.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  namespace: intel-gpu
  labels:
    app: intel-gpu-plugin
spec:
  selector:
    matchLabels:
      app: intel-gpu-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: intel-gpu-plugin
    spec:
      # Scheduled by GPU label, not node-type: talos-worker-0 is the only VM
      # holding the passed-through iGPU, and the plugin has nothing to advertise
      # anywhere else.
      nodeSelector:
        kubernetes.io/arch: amd64
        gpu: intel
      containers:
        - name: intel-gpu-plugin
          image: intel/intel-gpu-plugin:0.36.0@sha256:2db679be62b52ac985169084ca711cab6e6c59fe543ab2ddee58163d6f8d29e0
          imagePullPolicy: IfNotPresent
          args:
            # One physical render node, advertised as 2 allocatable devices so
            # plex and emby can hold it concurrently. QuickSync multiplexes
            # fine; this is an accounting limit, not a hardware partition.
            - -shared-dev-num
            - "2"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: 45Mi
              cpu: 40m
            limits:
              memory: 90Mi
              cpu: 100m
          volumeMounts:
            - name: devfs
              mountPath: /dev/dri
              readOnly: true
            - name: sysfsdrm
              mountPath: /sys/class/drm
              readOnly: true
            - name: kubeletsockets
              mountPath: /var/lib/kubelet/device-plugins
            - name: cdipath
              mountPath: /var/run/cdi
      volumes:
        - name: devfs
          hostPath:
            path: /dev/dri
        - name: sysfsdrm
          hostPath:
            path: /sys/class/drm
        - name: kubeletsockets
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: cdipath
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
