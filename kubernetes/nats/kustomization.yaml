apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nats
resources:
  - certificates.yaml
  - network-policy.yaml

configMapGenerator:
  - name: nats-values
    files:
      - values.yaml=nats-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
