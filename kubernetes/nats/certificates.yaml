apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-server
  namespace: nats
spec:
  secretName: nats-server
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    kind: ClusterIssuer
    name: homelab-ca
  dnsNames:
    - nats
    - nats.nats
    - nats.nats.svc
    - nats.nats.svc.cluster.local
    - "*.nats-headless"
    - "*.nats-headless.nats"
    - "*.nats-headless.nats.svc"
    - "*.nats-headless.nats.svc.cluster.local"
  # client auth too: a server dialling a route presents this same cert.
  usages:
    - server auth
    - client auth

---
# Client identities are the subject DN, matched by `verify_and_map` against
# the users in nats-values.yaml. No SANs: NATS would try those first.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-box
  namespace: nats
spec:
  secretName: nats-box
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    kind: ClusterIssuer
    name: homelab-ca
  commonName: nats-box.nats
  usages:
    - client auth

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-box-sys
  namespace: nats
spec:
  secretName: nats-box-sys
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    kind: ClusterIssuer
    name: homelab-ca
  commonName: nats-box-sys.nats
  usages:
    - client auth
