tlsCA:
  enabled: true
  configMapName: homelab-ca
  key: ca.crt

config:
  cluster:
    enabled: true
    replicas: 3
    routeURLs:
      useFQDN: true
    tls:
      enabled: true
      secretName: nats-server
      merge:
        verify: true

  jetstream:
    enabled: true
    fileStore:
      pvc:
        size: 5Gi
        # JetStream replicates at R3 itself; Longhorn's 2 replicas would make six copies.
        storageClassName: longhorn-single

  nats:
    tls:
      enabled: true
      secretName: nats-server
      merge:
        verify_and_map: true

  leafnodes:
    enabled: true
    tls:
      enabled: true
      secretName: nats-server
      merge:
        verify_and_map: true

  merge:
    system_account: SYS
    accounts:
      APP:
        jetstream: enabled
        users:
          - user: "CN=nats-box.nats"
          - user: "CN=ed.nats"
          # The LAN-facing MQTT tier: everything it can reach on the hub is listed here.
          - user: "CN=nats-mqtt-leaf.nats-mqtt"
            allowed_connection_types: ["LEAFNODE"]
            permissions:
              publish: &mqtt-subjects ["shellies.>", "glow.>", "homeassistant.>", "truenas.>", "proxmox.>"]
              subscribe: *mqtt-subjects
          - user: "CN=nack.nack"
            permissions:
              publish: ["$JS.API.>"]
              subscribe: ["_INBOX.>"]
          - user: "CN=alert-relay.alert-relay"
            permissions:
              publish: ["alerts.>"]
              # JetStream publish acks come back on an inbox.
              subscribe: ["_INBOX.>"]
          - user: "CN=claude-agent.claude-agent"
            permissions:
              publish:
                - "$JS.API.INFO"
                - "$JS.API.CONSUMER.INFO.ALERTS.claude-agent"
                - "$JS.API.CONSUMER.MSG.NEXT.ALERTS.claude-agent"
                - "$JS.ACK.ALERTS.claude-agent.>"
                - "$JS.API.STREAM.INFO.HEATING"
                - "$JS.API.CONSUMER.CREATE.HEATING.>"
                - "$JS.API.CONSUMER.MSG.NEXT.HEATING.>"
                - "$JS.API.CONSUMER.INFO.HEATING.>"
                - "$JS.API.CONSUMER.DELETE.HEATING.>"
              subscribe: ["_INBOX.>", "homeassistant.statestream.>", "homeassistant.heating_curve.>", "heating.curve.>"]
          - user: "CN=energy-telemetry.energy-telemetry"
            permissions:
              publish:
                deny: [">"]
              subscribe: ["glow.*.SENSOR.>", "homeassistant.statestream.>", "truenas.power", "proxmox.power"]
          # Replays ENERGY, keeps its own HEATING stream, and publishes HA discovery on the hub;
          # the nats-mqtt leaf carries homeassistant.> to HA.
          - user: "CN=heating-curve.heating-curve"
            permissions:
              publish:
                - "$JS.API.INFO"
                - "$JS.API.STREAM.INFO.ENERGY"
                - "$JS.API.STREAM.MSG.GET.ENERGY"
                - "$JS.API.DIRECT.GET.ENERGY.>"
                - "$JS.API.CONSUMER.CREATE.ENERGY.>"
                - "$JS.API.CONSUMER.MSG.NEXT.ENERGY.>"
                - "$JS.API.CONSUMER.INFO.ENERGY.>"
                - "$JS.API.CONSUMER.DELETE.ENERGY.>"
                - "$JS.API.STREAM.INFO.HEATING"
                - "$JS.API.CONSUMER.CREATE.HEATING.>"
                - "$JS.API.CONSUMER.MSG.NEXT.HEATING.>"
                - "$JS.API.CONSUMER.INFO.HEATING.>"
                - "$JS.API.CONSUMER.DELETE.HEATING.>"
                - "heating.curve.>"
                - "homeassistant.sensor.heating_curve_advisor.>"
                - "homeassistant.heating_curve.>"
              subscribe: ["_INBOX.>", "homeassistant.status"]
      SYS:
        users:
          - user: "CN=nats-box-sys.nats"
          - user: "CN=ed-sys.nats"

container:
  merge:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 1Gi

podTemplate:
  topologySpreadConstraints:
    kubernetes.io/hostname:
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule
  merge:
    spec:
      nodeSelector:
        node-type: standard

promExporter:
  enabled: true
  podMonitor:
    enabled: true

natsBox:
  contexts:
    default:
      tls:
        secretName: nats-box
    sys:
      tls:
        secretName: nats-box-sys
  podTemplate:
    merge:
      spec:
        nodeSelector:
          node-type: standard
