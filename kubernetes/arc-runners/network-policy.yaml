---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: arc-runners
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
# Allow runners to reach GitHub, download tooling, and manage the cluster.
# Safe only because of who may start a run — see kubernetes/arc-systems/README.md.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-world-egress
  namespace: arc-runners
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - world
        - kube-apiserver
