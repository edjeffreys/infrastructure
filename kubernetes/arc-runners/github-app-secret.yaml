---
# Same 1Password item as arc-systems/github-app-secret.yaml, deliberately
# duplicated into this namespace.
#
# gha-runner-scale-set resolves `githubConfigSecret` in the AutoscalingRunnerSet's
# OWN namespace, not the controller's. With the Secret only in arc-systems the
# controller fails reconcile with "failed to get kubernetes secret:
# arc-runners/arc-github-app", the AutoscalingRunnerSet stays phase=Pending, no
# listener pod is ever created, and jobs queue forever on "Waiting for a runner
# to pick up this job" with nothing in the GitHub UI explaining why.
#
# The 1Password item MUST carry all three of these fields, named exactly (the
# operator maps each field label to a Secret key verbatim):
#
#   github_app_id
#   github_app_installation_id
#   github_app_private_key
#
# ARC's validator is all-or-nothing — see hasGitHubAppAuth() in
# apis/actions.github.com/v1alpha1/appconfig/appconfig.go. Omit any one field and
# it reports "no credentials provided: either a PAT or GitHub App credentials
# should be provided", as though the Secret were empty, which sends you looking
# for the wrong problem. A missing github_app_installation_id is what kept this
# scale set Pending from April to August 2026.
#
# Two traps:
#   - github_app_installation_id is the INSTALLATION id, not the App id. Find it
#     at github.com > Settings > Applications > Configure; it is the trailing
#     path segment of the URL. Store digits only — ARC parses it with
#     strconv.ParseInt and a prefixed or quoted value fails differently.
#   - github_app_private_key must be the PKCS#1 PEM GitHub issues when you
#     generate the App key ("-----BEGIN RSA PRIVATE KEY-----"), in a multi-line
#     field. An OpenSSH-format key, or a single-line field that eats the
#     newlines, fails later with an opaque JWT/parse error instead.
#
# See kubernetes/arc-systems/README.md.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  itemPath: "vaults/Secrets/items/Github ARC"
