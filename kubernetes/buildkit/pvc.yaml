---
# Layer cache. The GC caps in buildkitd.toml are absolute, so resizing this
# claim means revisiting them — README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-cache-single
  namespace: buildkit
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-single
  resources:
    requests:
      storage: 10Gi
