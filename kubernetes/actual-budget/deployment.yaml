---
# Actual's sync server. There is no Postgres option: the sync protocol is built
# around each budget being its own SQLite file, which the server stores whole
# under /data and ships to clients as a blob. SQLite is the data model here, not
# a default backend to be swapped out, so no CNPG Cluster accompanies this app
# (see kubernetes/arr/postgres/ for what that would have looked like).
#
# That leaves the whole dataset on one ReadWriteOnce Longhorn volume, so:
# replicas 1 and strategy Recreate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  namespace: actual-budget
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: actual-budget
  template:
    metadata:
      labels:
        app: actual-budget
    spec:
      nodeSelector:
        node-type: standard
      securityContext:
        # The image creates the "actual" user (uid/gid 1001) but never switches
        # to it, so without this the server runs as root. Everything it writes
        # lives under /data — config.json is only ever read — so running as 1001
        # with a matching fsGroup on the volume is enough.
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: actual-budget
          image: ghcr.io/actualbudget/actual-server:26.8.1@sha256:6478d9ddfc0924479c09e6699c205e354c6f2216dfe7de3c0fb7b590d6edcdc5
          ports:
            - containerPort: 5006
          env:
            - name: TZ
              value: Europe/London
            # Defaulted by the image only because /data happens to exist in it;
            # stated here so a base-image change cannot silently relocate the
            # budget files to the (ephemeral) app directory.
            - name: ACTUAL_DATA_DIR
              value: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-budget-data
