---
# No CNPG cluster because there is no Postgres option: Actual's sync protocol
# makes each budget its own SQLite file, stored whole and shipped to clients as
# a blob. SQLite is the data model, not a swappable backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  namespace: actual-budget
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: actual-budget
  template:
    metadata:
      labels:
        app: actual-budget
    spec:
      nodeSelector:
        node-type: standard
      securityContext:
        # The image creates this user but never switches to it, so without this
        # the server runs as root. Everything it writes is under /data.
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: actual-budget
          image: ghcr.io/actualbudget/actual-server:26.9.0@sha256:552beab3dec8c93d46b8b9245612d63c3f123b8a45063a474f53e229b17621d3
          ports:
            - containerPort: 5006
          env:
            - name: TZ
              value: Europe/London
            # The image's default only holds because /data exists in it. Pinned
            # so a base image change cannot relocate the budget files.
            - name: ACTUAL_DATA_DIR
              value: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-budget-data
