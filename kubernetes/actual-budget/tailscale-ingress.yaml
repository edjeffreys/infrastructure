apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual-budget-tailscale
  namespace: actual-budget
  annotations:
    tailscale.com/hostname: "actual-budget"
    tailscale.com/proxy-class: "standard"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual-budget
                port:
                  number: 5006
  tls:
    - hosts:
        - actual-budget
