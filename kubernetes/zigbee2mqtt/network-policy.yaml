---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: zigbee2mqtt
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-tailscale-ingress
  namespace: zigbee2mqtt
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

---
# The SLZB-06U sits on the IoT VLAN; the router must also allow the worker VLAN to it on 6638.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-coordinator-egress
  namespace: zigbee2mqtt
spec:
  endpointSelector: {}
  egress:
    - toCIDR:
        - 10.100.0.252/32
      toPorts:
        - ports:
            - port: "6638"
              protocol: TCP

---
# mqtt.skaal.dev is the nats-mqtt VIP, which Cilium resolves to the leaf pods in-cluster.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-mqtt-egress
  namespace: zigbee2mqtt
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: nats-mqtt
            app.kubernetes.io/component: nats
      toPorts:
        - ports:
            - port: "8883"
              protocol: TCP
