apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zigbee2mqtt-tailscale
  namespace: zigbee2mqtt
  annotations:
    tailscale.com/hostname: "zigbee2mqtt"
    tailscale.com/proxy-class: "standard"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zigbee2mqtt
                port:
                  number: 8080
  tls:
    - hosts:
        - zigbee2mqtt
