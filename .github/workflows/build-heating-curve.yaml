name: Build heating-curve image

# The job container is only the buildctl client; the build runs on the
# in-cluster buildkitd, which needs a seccomp exemption arc-runners must not
# have (kubernetes/buildkit/README.md).
# The build job has no checkout step: buildkit clones its --opt context git URL itself.

on:
  push:
    branches: [master]
    paths:
      - images/heating-curve/**
      - .github/workflows/build-heating-curve.yaml
  pull_request:
    paths:
      - images/heating-curve/**
      - .github/workflows/build-heating-curve.yaml
  workflow_dispatch:

permissions:
  contents: read

# Don't cancel a build for a newer push - it should still finish, not leave
# :latest built from neither commit.
concurrency:
  group: build-heating-curve-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: arc-runners
    container:
      image: golang:1.27.4
    defaults:
      run:
        working-directory: images/heating-curve
    steps:
      - uses: actions/checkout@v7
      - run: go vet ./...
      - run: go test ./...

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: arc-runners
    permissions:
      contents: read
      packages: write
    container:
      # Keep in step with the daemon in kubernetes/buildkit/deployment.yaml —
      # Renovate groups them so they land in one PR.
      image: moby/buildkit:v0.34.2
    steps:
      - name: Build and push
        run: |
          set -eu

          # buildctl forwards this to the daemon over the build session, so the
          # token never reaches buildkitd's cache. DOCKER_CONFIG: HOME may be unset.
          export DOCKER_CONFIG=/tmp/.docker
          AUTH=$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')
          mkdir -p "${DOCKER_CONFIG}"
          cat <<EOF > "${DOCKER_CONFIG}/config.json"
          {"auths":{"ghcr.io":{"auth":"${AUTH}"}}}
          EOF

          SHA_TAG="sha-$(echo "${GITHUB_SHA}" | head -c7)"
          IMAGE=ghcr.io/edjeffreys/heating-curve

          # No credentials on the context URL: the repo is public. A private
          # repo would need the token passed as a buildkit secret instead.
          buildctl \
            --addr tcp://buildkitd.buildkit:1234 \
            build \
            --no-cache \
            --frontend dockerfile.v0 \
            --opt image-resolve-mode=pull \
            --opt "context=https://github.com/${GITHUB_REPOSITORY}.git#${GITHUB_SHA}:images/heating-curve" \
            --opt filename=Dockerfile \
            --output "type=image,\"name=${IMAGE}:latest,${IMAGE}:${SHA_TAG}\",push=true" \
            --progress plain

          touch "${RUNNER_TEMP}/build-complete"

      # A build cut off mid-step has been reported as a successful step, with
      # nothing pushed. Only a script that reached its last line leaves this.
      - name: Check the build ran to completion
        run: test -f "${RUNNER_TEMP}/build-complete"
