name: Review dependency bump

# Advisory only: deliberately not a required check, so a model outage or a
# wrong verdict can never hold up a merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-dependency-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Not pull_request_target: Renovate branches live in this repo, so the
    # secret is available without exposing it to fork PRs.
    if: github.event.pull_request.user.login == 'renovate[bot]' || startsWith(github.head_ref, 'test/review-')
    runs-on: arc-runners
    env:
      HELM_VERSION: "v3.22.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install helm
        run: |
          set -euo pipefail
          curl -sSLf "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" --strip-components=1 linux-amd64/helm
          echo "HELM=${RUNNER_TEMP}/helm" >> "$GITHUB_ENV"

      - name: Review and comment
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # A repository variable, not a literal, so the describer can be turned
          # down or off from the repo settings without a commit.
          DESCRIBE_BUMPS: ${{ vars.DESCRIBE_BUMPS || 'flagged' }}
        run: uv run --script scripts/review-dependency-bump.py
