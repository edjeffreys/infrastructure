# One ArgoCD Application carried two charts (`connect` and `secrets-injector`)
# from the same repo. Flux needs them as two HelmReleases: ArgoCD renders with
# `helm template`, which keeps no release registry, so both could share the
# release name `onepassword`. Helm proper cannot — two releases in one
# storageNamespace must have distinct names.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: onepassword
  namespace: flux-system
spec:
  interval: 1h
  url: https://1password.github.io/connect-helm-charts/

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: onepassword
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/onepassword
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: infrastructure

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword
  namespace: onepassword-operator
spec:
  interval: 30m
  # The connect chart names resources `<release>-<chart>`, which is why the live
  # Deployments are `onepassword-connect` and `onepassword-connect-operator`.
  # Changing this renames both and forces a recreation — the operator that
  # issues every OnePasswordItem-derived Secret in the cluster.
  releaseName: onepassword
  chart:
    spec:
      chart: connect
      version: "2.4.1"
      sourceRef:
        kind: HelmRepository
        name: onepassword
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: onepassword-operator-values

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: secrets-injector
  namespace: onepassword-operator
spec:
  interval: 30m
  # Distinct from the release above, and safe to set: this chart does not use
  # the release name in its resource names. Under ArgoCD it rendered with the
  # release name `onepassword`, yet every live resource is plain
  # `secrets-injector` — Deployment, Service, ServiceAccount and
  # `secrets-injector-webhook-config` — and the Deployment's immutable selector
  # is the static `app: secrets-injector`. So nothing is renamed by splitting it
  # into its own release.
  releaseName: secrets-injector
  chart:
    spec:
      chart: secrets-injector
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: onepassword
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: onepassword-secrets-injector-values
