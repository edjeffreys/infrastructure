# Here, not in kubernetes/nats-mqtt/, or root's dry-run of the HelmRelease wedges root.
apiVersion: v1
kind: Namespace
metadata:
  name: nats-mqtt

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nats-mqtt
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/nats-mqtt
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: homelab-ca
    - name: nats
  sourceRef:
    kind: GitRepository
    name: infrastructure

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats-mqtt
  namespace: nats-mqtt
spec:
  interval: 30m
  releaseName: nats-mqtt
  chart:
    spec:
      chart: nats
      version: "2.15.2"
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: nats-mqtt-values
