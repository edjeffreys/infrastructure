apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-ca
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/homelab-ca
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: cert-manager
    - name: trust-manager
  sourceRef:
    kind: GitRepository
    name: infrastructure
