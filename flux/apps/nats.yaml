apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats
  namespace: flux-system
spec:
  interval: 1h
  url: https://nats-io.github.io/k8s/helm/charts/

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nats
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/nats
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: homelab-ca
  sourceRef:
    kind: GitRepository
    name: infrastructure

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: nats
spec:
  interval: 30m
  releaseName: nats
  chart:
    spec:
      chart: nats
      version: "2.15.2"
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: nats-values
