# Here, not in kubernetes/pia-egress/, or root's dry-run of the HelmRelease wedges root.
apiVersion: v1
kind: Namespace
metadata:
  name: pia-egress

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pia-egress
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/pia-egress
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: infrastructure

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pia-egress
  namespace: pia-egress
spec:
  interval: 30m
  releaseName: pia-egress
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "11.21.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: pia-egress-values
