apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-agent
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/claude-agent
  dependsOn:
    - name: nack
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: infrastructure
